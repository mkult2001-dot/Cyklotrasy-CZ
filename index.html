<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cyklotrasy CZ – Mapy.com v7 prototyp</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;background:#f3f4f6;color:#111827}
header{padding:12px 16px;background:#111827;color:white;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0}.sub{font-size:13px;opacity:.8}
#controls{padding:12px 16px;background:white;border-bottom:1px solid #ddd;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,button,select{font:inherit}input{padding:9px 10px;border:1px solid #bbb;border-radius:8px;min-width:250px}
button,select{padding:9px 12px;border:1px solid #bbb;border-radius:8px;background:white}
button.primary{background:#1769e0;color:white;border-color:#1769e0}
#map{flex:1;min-height:420px}#info{padding:10px 16px;background:white;border-top:1px solid #ddd;font-size:14px}
.ok{color:#087443}.err{color:#b42318}.hint{opacity:.75}
@media(max-width:700px){input{min-width:180px;flex:1}}
</style>
</head>
<body>
<header><h1>Cyklotrasy CZ · Mapy.com v7 prototyp</h1><span class="sub">Turistická mapa + routing pro silniční kolo</span></header>
<div id="controls">
<input id="apiKey" type="password" autocomplete="off" placeholder="Vlož API klíč Mapy.com">
<button id="saveKey">Uložit klíč</button><button id="clearKey">Smazat klíč</button>
<select id="mapset"><option value="outdoor">Turistická mapa</option><option value="basic">Základní mapa</option><option value="winter">Zimní mapa</option></select>
<button id="clear">Vymazat body a trasu</button>
<span id="status" class="hint">1. klik = start · 2. klik = cíl</span>
</div>
<div id="map"></div>
<div id="info"><strong>Testovací režim:</strong> Start → Cíl, <strong>bike_road</strong>. <span id="metrics"></span></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
const keyInput=document.getElementById('apiKey'),status=document.getElementById('status'),metrics=document.getElementById('metrics');
const stored=localStorage.getItem('cyklotrasy_mapy_api_key'); if(stored) keyInput.value=stored;
const map=L.map('map',{preferCanvas:true}).setView([49.8,15.5],8);
let tiles,startMarker,endMarker,routeLayer,clicks=[];
const attribution='<a href="https://mapy.com/" target="_blank" rel="noopener">Mapy.com</a> | © Seznam.cz a.s. a další';

function addTiles(){
 if(tiles) map.removeLayer(tiles);
 const key=keyInput.value.trim(); if(!key){status.textContent='Nejdříve vlož API klíč Mapy.com.';status.className='err';return;}
 tiles=L.tileLayer(`https://api.mapy.com/v1/maptiles/${document.getElementById('mapset').value}/256/{z}/{x}/{y}?apikey=${encodeURIComponent(key)}`,
 {minZoom:0,maxZoom:19,tileSize:256,attribution});
 tiles.on('tileerror',()=>{status.textContent='Chyba mapových dlaždic. Zkontroluj API klíč a jeho omezení.';status.className='err';});
 tiles.addTo(map); status.textContent='Mapa Mapy.com načtena. 1. klik = start · 2. klik = cíl';status.className='hint';
}
document.getElementById('saveKey').onclick=()=>{const k=keyInput.value.trim();if(k){localStorage.setItem('cyklotrasy_mapy_api_key',k);addTiles();}};
document.getElementById('clearKey').onclick=()=>{localStorage.removeItem('cyklotrasy_mapy_api_key');keyInput.value='';if(tiles)map.removeLayer(tiles);status.textContent='API klíč odstraněn z tohoto zařízení.';};
document.getElementById('mapset').onchange=addTiles;

function clearAll(){
 clicks=[];[startMarker,endMarker,routeLayer].forEach(x=>{if(x)map.removeLayer(x)});
 startMarker=endMarker=routeLayer=null;metrics.textContent='';status.textContent='1. klik = start · 2. klik = cíl';status.className='hint';
}
document.getElementById('clear').onclick=clearAll;

async function route(a,b){
 const key=keyInput.value.trim(); if(!key)return;
 status.textContent='Počítám trasu přes Mapy.com…';status.className='hint';
 const u=new URL('https://api.mapy.com/v1/routing/route');
 u.searchParams.set('apikey',key);u.searchParams.set('lang','cs');
 u.searchParams.set('start',`${a.lng},${a.lat}`);u.searchParams.set('end',`${b.lng},${b.lat}`);
 u.searchParams.set('routeType','bike_road');u.searchParams.set('format','geojson');
 try{
  const r=await fetch(u,{mode:'cors',cache:'no-store'}); if(!r.ok)throw new Error(`HTTP ${r.status}`);
  const d=await r.json();if(!d.geometry)throw new Error('Mapy.com nevrátily geometrii trasy.');
  if(routeLayer)map.removeLayer(routeLayer);
  routeLayer=L.geoJSON(d.geometry,{style:{color:'#1565e0',weight:6,opacity:.9}}).addTo(map);
  map.fitBounds(routeLayer.getBounds(),{padding:[30,30]});
  const km=d.length/1000,min=Math.round(d.duration/60);
  metrics.innerHTML=` · <strong>${km.toFixed(1)} km</strong> · ${Math.floor(min/60)} h ${min%60} min`;
  status.textContent='Trasa vypočtena Mapy.com · bike_road';status.className='ok';
 }catch(e){console.error(e);status.textContent=`Routing selhal: ${e.message}`;status.className='err';}
}
map.on('click',e=>{
 if(!keyInput.value.trim()){status.textContent='Vlož a ulož API klíč Mapy.com.';status.className='err';return;}
 if(clicks.length>=2)clearAll();clicks.push(e.latlng);
 if(clicks.length===1){startMarker=L.marker(e.latlng).addTo(map).bindPopup('Start').openPopup();status.textContent='Start nastaven. Nyní klikni na cíl.';}
 else{endMarker=L.marker(e.latlng).addTo(map).bindPopup('Cíl').openPopup();route(clicks[0],clicks[1]);}
});
if(stored)addTiles();
})();
</script>
</body></html>
